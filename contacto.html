<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futbolle - Contacto</title>
  <link rel="stylesheet" href="CSS/reset.css">
  <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

  <header class="header">
    <h1 class="header-title">Futbolle</h1>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">Juego</a>
      <a href="contacto.html" class="nav-link active">Contacto</a>
      <a href="https://github.com/ChaconAna/ChaconAna-Final-DAW-TM" target="_blank" class="nav-link">GitHub</a>
    </nav>
  </header>

  <main class="main-container">
    <section class="contact-section">
      <h2 class="section-title">Formulario de Contacto</h2>
      
      <!-- ATRIBUTO 'novalidate': Desactiva las validaciones nativas por defecto del navegador HTML5 
           para asegurar que la lógica de validación sea ejecutada al 100% por JavaScript (contact.js). -->
      <form id="contact-form" class="contact-form" novalidate>
        <div class="form-group">
          <label for="contact-name" class="input-label">Nombre Alfanumérico:</label>
          <input type="text" id="contact-name" class="text-input" placeholder="Ej: JuanPerez123">
        </div>

        <div class="form-group">
          <label for="contact-email" class="input-label">Correo Electrónico:</label>
          <input type="text" id="contact-email" class="text-input" placeholder="Ej: correo@dominio.com">
        </div>

        <div class="form-group">
          <label for="contact-message" class="input-label">Mensaje:</label>
          <textarea id="contact-message" class="text-input text-area" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>

        <button type="submit" id="btn-submit-contact" class="btn">Enviar Mensaje</button>
      </form>
    </section>
  </main>

  <!-- MODAL DE VENTANA EMERGENTE: Se utiliza para mostrar los mensajes de éxito o error al enviar el formulario -->
  <div id="modal-container" class="modal-overlay hidden">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-title">Aviso</h2>
      <p id="modal-message" class="modal-message">Mensaje del sistema...</p>
      <button id="btn-close-modal" class="btn">Aceptar</button>
    </div>
  </div>

  <script src="JS/contact.js"></script>
</body>
</html>
